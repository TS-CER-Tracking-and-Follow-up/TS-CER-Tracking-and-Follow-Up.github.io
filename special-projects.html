*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{max-width:1500px;margin:auto;padding:24px}.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}.back{color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff}.brand{flex:1;min-width:200px}.brand h1{font-size:24px;line-height:1.2;margin:0 0 5px;letter-spacing:-.5px}.brand p{margin:0;color:var(--muted)}.user{color:var(--muted);font-size:12px}.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:9px;padding:9px 13px;font-weight:650;box-shadow:0 1px 2px #17243608}.btn:hover{background:#f3f6fa}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:var(--danger)}.grid{display:grid;grid-template-columns:285px minmax(0,1fr);gap:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 4px 16px #17243608}.cardhead{display:flex;align-items:center;gap:10px;padding:15px 16px;border-bottom:1px solid var(--line)}.cardhead h2{font-size:14px;margin:0;flex:1}.project-list{padding:8px;display:grid;gap:7px}.project{width:100%;text-align:left;border:1px solid transparent;border-radius:10px;padding:12px;background:transparent;color:inherit}.project:hover,.project.active{background:#edf7f4;border-color:#c6e4db}.project strong{display:block;font-size:13px}.project small{display:block;color:var(--muted);margin-top:4px}.pill{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px;padding:2px 8px;font-size:11px;color:var(--muted);margin:5px 4px 0 0;background:#fff}.status{color:var(--accent);background:#edf8f4;border-color:#cce9df}.content{min-width:0}.empty{padding:44px 22px;text-align:center;color:var(--muted)}.empty h2{color:var(--text);font-size:20px}.detailhead{padding:20px 22px;border-bottom:1px solid var(--line);background:linear-gradient(120deg,#fff,#f8fbff)}.detailtitle{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}.detailtitle h2{margin:0;font-size:23px;letter-spacing:-.4px;flex:1;min-width:180px}.detailhead p{color:var(--muted);margin:8px 0 0;max-width:800px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:17px}.metric{background:#fff;border:1px solid var(--line);border-radius:11px;padding:13px}.metric small{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.metric strong{font-size:20px;letter-spacing:-.3px}.tabs{display:flex;gap:4px;padding:10px 14px;border-bottom:1px solid var(--line);overflow:auto;background:#fff}.tab{border:0;border-radius:8px;background:transparent;color:var(--muted);padding:9px 12px;white-space:nowrap;font-weight:600}.tab.active{background:#eaf5f1;color:#116d5b}.section{padding:18px}.sectionbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.sectionbar h3{font-size:15px;margin:0;flex:1}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:#f6f8fb}td{font-size:13px}tr:last-child td{border-bottom:0}.field{display:grid;gap:5px;margin-bottom:13px}.field label{color:var(--muted);font-size:12px;font-weight:650}.field input,.field textarea,.field select,.inline-input{width:100%;background:#fff;border:1px solid #d5deea;border-radius:8px;padding:10px;color:var(--text);outline:none}.field textarea{min-height:90px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.wide{grid-column:1/-1}.notice{padding:11px 13px;border-radius:9px;background:#eef5ff;color:#28517e;margin-bottom:12px;border:1px solid #d9e7fa}.error{background:#fff0f0;color:#a32030;border-color:#f1cccc}.success{background:#edf8f2;color:#14694d;border-color:#c9e9d8}.list{display:grid;gap:9px}.activity{padding:13px;border:1px solid var(--line);border-radius:10px;background:#fff}.activity p{margin:5px 0 0;white-space:pre-wrap}.muted{color:var(--muted)}.hidden{display:none!important}.actions{display:flex;gap:7px;flex-wrap:wrap}.small{font-size:12px;padding:6px 9px}.progress{height:6px;background:#e8edf4;border-radius:99px;overflow:hidden;margin-top:7px}.progress span{display:block;height:100%;background:var(--accent)}.modal{position:fixed;inset:0;background:#14203370;display:grid;place-items:center;padding:16px;z-index:20}.dialog{width:min(700px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 20px 60px #14203330}.dialoghead{display:flex;align-items:center;margin-bottom:16px}.dialoghead h2{margin:0;flex:1;font-size:18px}.toast{position:fixed;right:18px;bottom:18px;max-width:min(450px,calc(100% - 36px));background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;z-index:30;box-shadow:0 12px 40px #17243620}.loading{padding:30px;text-align:center;color:var(--muted)}.overview-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(250px,.7fr);gap:14px}.subcard{border:1px solid var(--line);border-radius:12px;padding:15px;background:#fff;min-width:0}.subcard h3{font-size:14px;margin:0 0 12px}.kpi-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #edf0f5}.kpi-row:last-child{border-bottom:0}.stage{display:inline-flex;padding:4px 8px;border-radius:7px;background:#f0f4f8;color:#45556a;font-size:11px;font-weight:650}.alert-line{padding:10px 11px;border-radius:9px;background:#fff7e8;color:#855313;margin:7px 0;font-size:12px}.subtext{font-size:11px;color:var(--muted);margin-top:3px}@media(max-width:900px){.shell{padding:14px}.grid{grid-template-columns:1fr}.project-list{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.overview-grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}.brand h1{font-size:20px}.metrics{gap:7px}.metric strong{font-size:17px}.section{padding:12px}}
</style>

<body>
<div class="shell">
<header class="top"><a class="back" href="index.html">← CER Tracker</a><div class="brand"><h1>Special Project Management</h1><p>Plan the budget, manage every purchase, and follow delivery through final acceptance.</p></div><div class="user" id="userLabel">Checking sign-in…</div><button class="btn" id="refreshBtn">Refresh</button><button class="btn primary" id="newProjectBtn">＋ New project</button></header>

<script>
"use strict";
const SUPABASE_URL="https://igfvoqgeztzmgeebpdgu.supabase.co";
const SUPABASE_KEY="sb_publishable_WMSL5tXYCVYjUJ1VNYacIQ_HkdWdLu_";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const state={user:null,projects:[],selected:null,tasks:[],milestones:[],updates:[],members:[],items:[],tab:"overview"};
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const date=v=>v?new Date(v+"T00:00:00").toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}):"—";
const statusLabel=s=>({active:"Active",on_hold:"On hold",completed:"Completed",cancelled:"Cancelled",todo:"To do",in_progress:"In progress",blocked:"Blocked",done:"Done",pending:"Pending",planned:"Planned",rfq:"RFQ / sourcing",quotes_received:"Quotes received",evaluation:"Technical evaluation",approval_pending:"Approval pending",approved:"Approved",po_issued:"PO issued",part_received:"Partially received",received:"Received",cancelled_item:"Cancelled",not_started:"Not started",scheduled:"Scheduled",installed:"Installed",tested:"Tested",accepted:"Accepted"}[s]||s||"—");
function toast(msg,bad=false){$("toastRoot").innerHTML='<div class="toast '+(bad?'error':'')+'">'+esc(msg)+'</div>';setTimeout(()=>{$("toastRoot").innerHTML=""},4500)}
function showNotice(msg,bad=false){$("notice").textContent=msg;$("notice").className="notice"+(bad?" error":"");$("notice").classList.remove("hidden")}
function clearNotice(){$("notice").classList.add("hidden")}
function fail(e){console.error(e);const msg=e?.message||String(e)||"Something went wrong.";showNotice(msg,true);toast(msg,true);const form=$("modalForm");if(form){let box=$("modalSaveError");if(!box){box=document.createElement("div");box.id="modalSaveError";box.className="notice error";form.querySelector(".dialoghead")?.after(box)}box.textContent=msg;box.classList.remove("hidden");const b=$("modalSaveButton");if(b){b.disabled=false;b.textContent="Try again"}}}
async function rows(table,query){const {data,error}=await query;if(error)throw error;return data||[]}
async function requireSession(){const {data,error}=await sb.auth.getSession();if(error)throw error;state.user=data.session?.user||null;if(!state.user){$("userLabel").textContent="Not signed in";showNotice("Please sign in to CER Tracker first, then open Special Project Management again.",true);$("projectList").innerHTML='<div class="empty">Sign in through the main CER Tracker, then return here.</div>';return false}$("userLabel").textContent=state.user.email||"Signed in";return true}
async function loadProjects(keep=true){clearNotice();const {data,error}=await sb.from("special_projects").select("*").order("updated_at",{ascending:false});if(error)throw error;state.projects=data||[];$("projectCount").textContent=state.projects.length;renderProjectList();if(keep&&state.selected&&state.projects.some(p=>p.id===state.selected))await openProject(state.selected);else if(state.projects.length)await openProject(state.projects[0].id);else{$("projectDetail").innerHTML='<div class="empty"><h2>No projects yet</h2><p>Create a project to organize tasks, milestones and updates.</p><button class="btn primary" onclick="newProject()">＋ Create first project</button></div>'}}
function renderProjectList(){$("projectList").innerHTML=state.projects.length?state.projects.map(p=>'<button class="project '+(p.id===state.selected?'active':'')+'" data-project="'+p.id+'"><strong>'+esc(p.title)+'</strong><small>'+esc(statusLabel(p.status))+' · Due '+esc(date(p.due_date))+'</small><span class="pill">'+esc(p.priority)+'</span><span class="pill">'+Number(p.progress||0)+'% complete</span><div class="progress"><span style="width:'+Math.max(0,Math.min(100,Number(p.progress||0)))+'%"></span></div></button>').join(""):'<div class="empty">No projects yet.</div>'}
async function openProject(id){state.selected=id;state.tab="overview";renderProjectList();const p=state.projects.find(x=>x.id===id);if(!p)return;$("projectDetail").innerHTML='<div class="loading">Loading project workspace…</div>';try{const [tasks,milestones,updates,members,items]=await Promise.all([rows("special_project_tasks",sb.from("special_project_tasks").select("*").eq("project_id",id).order("sort_order").order("created_at")),rows("special_project_milestones",sb.from("special_project_milestones").select("*").eq("project_id",id).order("target_date")),rows("special_project_updates",sb.from("special_project_updates").select("*").eq("project_id",id).order("created_at",{ascending:false}).limit(100)),rows("special_project_members",sb.from("special_project_members").select("*").eq("project_id",id)),rows("special_project_items",sb.from("special_project_items").select("*").eq("project_id",id).order("created_at"))]);state.tasks=tasks;state.milestones=milestones;state.updates=updates;state.members=members;state.items=items;renderDetail()}catch(e){fail(e);$("projectDetail").innerHTML='<div class="empty"><h2>Could not load project</h2><p>'+esc(e.message)+'</p><p>Confirm the database setup SQL has been run.</p></div>'}}
function canManage(){const p=state.projects.find(x=>x.id===state.selected);return !!p&&(p.owner_uid===state.user?.id||state.members.some(m=>m.user_id===state.user?.id&&m.role==="manager"))}
function renderDetail(){
 const p=state.projects.find(x=>x.id===state.selected);if(!p)return;
 const tab=state.tab;let body="";
 if(tab==="overview")body=overviewMarkup(p);
 else if(tab==="items")body=itemsMarkup();
 else if(tab==="procurement")body=procurementMarkup();
 else if(tab==="closure")body=closureMarkup();
 else if(tab==="tasks")body=tasksMarkup();
 else if(tab==="milestones")body=milestonesMarkup();
 else if(tab==="activity")body=activityMarkup();
 else if(tab==="members")body=membersMarkup();
 const budget=Number(p.approved_budget||0);
 const committed=state.items.reduce((n,i)=>n+Number(i.quantity||0)*Number(i.po_unit_cost||0),0);
 const paid=state.items.reduce((n,i)=>n+Number(i.actual_paid_amount||0),0);
 const progress=state.items.length?Math.round(state.items.filter(i=>i.testing_status==="accepted"||i.procurement_status==="cancelled_item").length/state.items.length*100):0;
 $("projectDetail").innerHTML='<div class="detailhead"><div class="detailtitle"><div style="flex:1;min-width:200px"><h2>'+esc(p.title)+'</h2><p>'+esc(p.description||"Budget, purchasing, delivery and close-out in one workspace.")+'</p></div><span class="pill status">'+esc(statusLabel(p.status))+'</span><button class="btn small" id="editProjectBtn">Edit project</button></div><div class="metrics"><div class="metric"><small>Approved budget</small><strong style="font-size:18px">৳'+money(budget)+'</strong></div><div class="metric"><small>Committed by PO</small><strong style="font-size:18px">৳'+money(committed)+'</strong></div><div class="metric"><small>Paid to date</small><strong style="font-size:18px">৳'+money(paid)+'</strong></div><div class="metric"><small>Budget not committed</small><strong style="font-size:18px;color:'+(budget-committed<0?'var(--danger)':'var(--accent)')+'">৳'+money(budget-committed)+'</strong></div></div><div class="progress"><span style="width:'+progress+'%"></span></div><small class="muted">'+progress+'% of items accepted or cancelled · '+state.items.length+' tracked items</small></div><div class="tabs"><button class="tab '+(tab==="overview"?"active":"")+'" data-tab="overview">Overview</button><button class="tab '+(tab==="items"?"active":"")+'" data-tab="items">Item register</button><button class="tab '+(tab==="procurement"?"active":"")+'" data-tab="procurement">Procurement & delivery</button><button class="tab '+(tab==="closure"?"active":"")+'" data-tab="closure">Installation & closure</button><button class="tab '+(["tasks","milestones","activity","members"].includes(tab)?"active":"")+'" data-tab="more">More ▾</button></div><div class="section">'+body+'</div>';
 $("editProjectBtn").hidden=!canManage();$("editProjectBtn").onclick=()=>projectModal(p);
 $("projectDetail").querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{
  if(b.dataset.tab==="more"){const opts=[["tasks","Tasks"],["milestones","Milestones"],["activity","Activity log"],["members","Project access"]];const choice=prompt("Open More section:\n"+opts.map((x,i)=>(i+1)+". "+x[1]).join("\n")+"\nEnter 1–4");const next=opts[Number(choice)-1]?.[0];if(next){state.tab=next;renderDetail()}return}
  state.tab=b.dataset.tab;renderDetail();
 });
 const search=$("itemSearch");if(search)search.oninput=()=>{const q=search.value.toLowerCase();$("projectDetail").querySelectorAll("[data-item-row]").forEach(r=>r.hidden=!r.dataset.search.includes(q))};
 $("projectDetail").querySelectorAll("[data-task-status]").forEach(sel=>{const task=state.tasks.find(t=>t.id===sel.dataset.taskStatus);sel.disabled=!canManage()&&task?.assignee_uid!==state.user?.id;sel.onchange=()=>updateTaskStatus(sel.dataset.taskStatus,sel.value)});
 $("projectDetail").querySelectorAll("[data-edit-task],[data-delete-task],[data-edit-milestone],[data-delete-milestone],[data-edit-item],[data-delete-item]").forEach(b=>b.hidden=!canManage());
 if($("itemImportBtn"))$("itemImportBtn").hidden=!canManage();if($("addItemBtn"))$("addItemBtn").hidden=!canManage();
 $("projectDetail").querySelectorAll("[data-item-quotes]").forEach(b=>b.hidden=!canManage());
 if($("addTaskBtn"))$("addTaskBtn").hidden=!canManage();if($("addMilestoneBtn"))$("addMilestoneBtn").hidden=!canManage();if($("addMemberBtn"))$("addMemberBtn").hidden=!canManage();
 $("projectDetail").querySelectorAll("[data-edit-item]").forEach(b=>b.onclick=()=>itemModal(state.items.find(i=>i.id===b.dataset.editItem)));
 $("projectDetail").querySelectorAll("[data-delete-item]").forEach(b=>b.onclick=()=>deleteItem(b.dataset.deleteItem));
 $("projectDetail").querySelectorAll("[data-item-quotes]").forEach(b=>b.onclick=()=>quotesModal(state.items.find(i=>i.id===b.dataset.itemQuotes)));
 $("projectDetail").querySelectorAll("[data-edit-task]").forEach(b=>b.onclick=()=>taskModal(state.tasks.find(t=>t.id===b.dataset.editTask)));
 $("projectDetail").querySelectorAll("[data-edit-milestone]").forEach(b=>b.onclick=()=>milestoneModal(state.milestones.find(m=>m.id===b.dataset.editMilestone)));
 $("projectDetail").querySelectorAll("[data-delete-task]").forEach(b=>b.onclick=()=>deleteTask(b.dataset.deleteTask));
 $("projectDetail").querySelectorAll("[data-delete-milestone]").forEach(b=>b.onclick=()=>deleteMilestone(b.dataset.deleteMilestone));
 $("addItemBtn")?.addEventListener("click",()=>itemModal());$("itemImportBtn")?.addEventListener("click",()=>$("itemCsvFile")?.click());$("itemCsvFile")?.addEventListener("change",e=>importItemsCsv(e.target.files?.[0]));$("itemExportBtn")?.addEventListener("click",exportItemsCsv);$("itemTemplateBtn")?.addEventListener("click",downloadItemsTemplate);
 $("addTaskBtn")?.addEventListener("click",()=>taskModal());$("addMilestoneBtn")?.addEventListener("click",()=>milestoneModal());$("addUpdateBtn")?.addEventListener("click",addUpdate);$("addMemberBtn")?.addEventListener("click",addMember);
 $("overviewEditProject")?.addEventListener("click",()=>projectModal(p));
}
function overviewMarkup(p){
 const budget=Number(p.approved_budget||0),estimate=state.items.reduce((n,i)=>n+Number(i.quantity||0)*Number(i.estimated_unit_cost||0),0),committed=state.items.reduce((n,i)=>n+Number(i.quantity||0)*Number(i.po_unit_cost||0),0),paid=state.items.reduce((n,i)=>n+Number(i.actual_paid_amount||0),0);
 const today=new Date().toISOString().slice(0,10),overdue=state.items.filter(i=>i.expected_delivery_date&&i.expected_delivery_date<today&&!["received","cancelled_item"].includes(i.procurement_status)),sourcing=state.items.filter(i=>["planned","rfq","quotes_received","evaluation","approval_pending"].includes(i.procurement_status)),awaitingAcceptance=state.items.filter(i=>i.procurement_status==="received"&&i.testing_status!=="accepted");
 return '<div class="overview-grid"><div class="subcard"><h3>Budget position</h3><div class="kpi-row"><span class="muted">Approved budget</span><strong>৳'+money(budget)+'</strong></div><div class="kpi-row"><span class="muted">Estimated requirement</span><strong>৳'+money(estimate)+'</strong></div><div class="kpi-row"><span class="muted">PO commitment</span><strong>৳'+money(committed)+'</strong></div><div class="kpi-row"><span class="muted">Paid to date</span><strong>৳'+money(paid)+'</strong></div><div class="kpi-row"><span class="muted">Uncommitted budget</span><strong style="color:'+(budget-committed<0?'var(--danger)':'var(--accent)')+'">৳'+money(budget-committed)+'</strong></div><div class="progress"><span style="width:'+(budget>0?Math.max(0,Math.min(100,committed/budget*100)):0)+'%"></span></div><p class="subtext">Commitment is calculated from PO unit cost × quantity. Enter paid-to-date per item separately.</p></div><div class="subcard"><h3>Needs your attention</h3>'+(!overdue.length&&!sourcing.length&&!awaitingAcceptance.length?'<p class="muted">No urgent follow-ups flagged.</p>':'')+(overdue.length?'<div class="alert-line">'+overdue.length+' overdue delivery item(s)</div>':'')+(sourcing.length?'<div class="alert-line">'+sourcing.length+' item(s) not yet at purchase-order stage</div>':'')+(awaitingAcceptance.length?'<div class="alert-line">'+awaitingAcceptance.length+' received item(s) awaiting testing or acceptance</div>':'')+'<div class="actions" style="margin-top:12px"><button class="btn small" data-tab="procurement">Review procurement</button><button class="btn small" data-tab="closure">Review completion</button></div></div><div class="subcard"><h3>Project details</h3><div class="kpi-row"><span class="muted">Owner</span><strong style="font-size:12px">'+esc(p.owner_uid===state.user?.id?"You":p.owner_uid||"—")+'</strong></div><div class="kpi-row"><span class="muted">Start date</span><strong>'+esc(date(p.start_date))+'</strong></div><div class="kpi-row"><span class="muted">Target completion</span><strong>'+esc(date(p.due_date))+'</strong></div><div class="kpi-row"><span class="muted">Status</span><strong>'+esc(statusLabel(p.status))+'</strong></div><button class="btn small" id="overviewEditProject">Edit project details</button></div><div class="subcard"><h3>Recent items</h3>'+(state.items.length?state.items.slice(0,5).map(i=>'<div class="kpi-row"><span><strong>'+esc(i.item_name)+'</strong><div class="subtext">'+esc(i.supplier_name||"Supplier not selected")+'</div></span><span class="stage">'+esc(statusLabel(i.procurement_status))+'</span></div>').join(""):'<p class="muted">No items yet. Start in the item register.</p>')+'<button class="btn small" data-tab="items" style="margin-top:10px">Open item register</button></div></div>';
}
function procurementMarkup(){
 const list=state.items.filter(i=>!["received","cancelled_item"].includes(i.procurement_status));
 return '<div class="sectionbar"><h3>Procurement & delivery follow-up</h3><span class="pill">'+list.length+' open items</span></div><p class="muted">Review sourcing, approval, PO and delivery dates in one list.</p>'+(list.length?'<div class="tablewrap"><table><thead><tr><th>Item</th><th>Stage</th><th>Supplier</th><th>PO number</th><th>PO value</th><th>Expected delivery</th><th>Action</th></tr></thead><tbody>'+list.map(i=>'<tr><td><strong>'+esc(i.item_name)+'</strong><div class="subtext">Qty '+esc(i.quantity)+' '+esc(i.unit)+'</div></td><td><span class="stage">'+esc(statusLabel(i.procurement_status))+'</span></td><td>'+esc(i.supplier_name||"Not selected")+'</td><td>'+esc(i.po_number||"—")+'</td><td>৳'+money(i.quantity*Number(i.po_unit_cost||0))+'</td><td>'+esc(date(i.expected_delivery_date))+'</td><td><button class="btn small" data-edit-item="'+i.id+'">Open item</button></td></tr>').join("")+'</tbody></table></div>':'<div class="empty">All items are received or cancelled.</div>');

function csvParse(text){const rows=[];let row=[],cell="",quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"')quoted=true;else if(c===","){row.push(cell);cell=""}else if(c==="\\n"){row.push(cell.replace(/\\r$/,""));if(row.some(v=>v.trim()))rows.push(row);row=[];cell=""}else cell+=c}row.push(cell.replace(/\\r$/,""));if(row.some(v=>v.trim()))rows.push(row);if(quoted)throw new Error("CSV has an unmatched quotation mark.");return rows}

function projectModal(p=null){modal(p?"Edit project":"Create a project",'<div class="formgrid">'+field("Project title","title",p?.title||"","text",true,'required maxlength="160"')+field("Description","description",p?.description||"","textarea",true)+field("Status","status",options([["active","Active"],["on_hold","On hold"],["completed","Completed"],["cancelled","Cancelled"]],p?.status||"active"),"select")+field("Priority","priority",options([["low","Low"],["medium","Medium"],["high","High"],["urgent","Urgent"]],p?.priority||"medium"),"select")+field("Start date","start_date",p?.start_date||"","date")+field("Due date","due_date",p?.due_date||"","date")+'</div>');$("modalForm").onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget);const payload={title:fd.get("title").trim(),description:fd.get("description").trim(),status:fd.get("status"),priority:fd.get("priority"),start_date:fd.get("start_date")||null,due_date:fd.get("due_date")||null,updated_at:new Date().toISOString()};try{const result=p?await sb.from("special_projects").update(payload).eq("id",p.id).select().single():await sb.from("special_projects").insert({...payload,owner_uid:state.user.id}).select().single();if(result.error)throw result.error;$("modalRoot").innerHTML="";toast(p?"Project updated":"Project created");await loadProjects(true);if(!p)await openProject(result.data.id)}catch(err){fail(err)}}}
function newProject(){if(!state.user){toast("Sign in through CER Tracker first.",true);return}projectModal()}
function taskModal(t=null){const p=state.projects.find(x=>x.id===state.selected);if(!p)return;modal(t?"Edit task":"Add task",'<div class="formgrid">'+field("Task title","title",t?.title||"","text",true,'required maxlength="180"')+field("Description","description",t?.description||"","textarea",true)+field("Assignee user UUID (optional)","assignee_uid",t?.assignee_uid||"","text",true,'placeholder="Supabase Auth user UUID"')+field("Status","status",options([["todo","To do"],["in_progress","In progress"],["blocked","Blocked"],["done","Done"]],t?.status||"todo"),"select")+field("Priority","priority",options([["low","Low"],["medium","Medium"],["high","High"],["urgent","Urgent"]],t?.priority||"medium"),"select")+field("Start date","start_date",t?.start_date||"","date")+field("Due date","due_date",t?.due_date||"","date")+'</div>');$("modalForm").onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget);const payload={title:fd.get("title").trim(),description:fd.get("description").trim(),assignee_uid:fd.get("assignee_uid").trim()||null,status:fd.get("status"),priority:fd.get("priority"),start_date:fd.get("start_date")||null,due_date:fd.get("due_date")||null,updated_at:new Date().toISOString()};try{let r=t?await sb.from("special_project_tasks").update(payload).eq("id",t.id).select().single():await sb.from("special_project_tasks").insert({...payload,project_id:p.id,created_by:state.user.id}).select().single();if(r.error)throw r.error;$("modalRoot").innerHTML="";toast(t?"Task updated":"Task added");await openProject(p.id)}catch(err){fail(err)}}}
async function updateTaskStatus(id,status){try{const r=await sb.from("special_project_tasks").update({status,updated_at:new Date().toISOString()}).eq("id",id);if(r.error)throw r.error;await openProject(state.selected)}catch(e){fail(e);await openProject(state.selected)}}
async function deleteTask(id){if(!confirm("Delete this task? This cannot be undone."))return;try{const r=await sb.from("special_project_tasks").delete().eq("id",id);if(r.error)throw r.error;toast("Task deleted");await openProject(state.selected)}catch(e){fail(e)}}
function milestoneModal(m=null){const p=state.projects.find(x=>x.id===state.selected);modal(m?"Edit milestone":"Add milestone",'<div class="formgrid">'+field("Milestone title","title",m?.title||"","text",true,'required')+field("Target date","target_date",m?.target_date||"","date")+field("Status","status",options([["pending","Pending"],["in_progress","In progress"],["completed","Completed"],["blocked","Blocked"]],m?.status||"pending"),"select")+field("Responsible user UUID","responsible_uid",m?.responsible_uid||"","text",true)+'</div>');$("modalForm").onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget);const payload={title:fd.get("title").trim(),target_date:fd.get("target_date")||null,status:fd.get("status"),responsible_uid:fd.get("responsible_uid").trim()||null,updated_at:new Date().toISOString()};try{const r=m?await sb.from("special_project_milestones").update(payload).eq("id",m.id).select().single():await sb.from("special_project_milestones").insert({...payload,project_id:p.id,created_by:state.user.id}).select().single();if(r.error)throw r.error;$("modalRoot").innerHTML="";toast(m?"Milestone updated":"Milestone added");await openProject(p.id)}catch(err){fail(err)}}}
async function deleteMilestone(id){if(!confirm("Delete this milestone?"))return;try{const r=await sb.from("special_project_milestones").delete().eq("id",id);if(r.error)throw r.error;toast("Milestone deleted");await openProject(state.selected)}catch(e){fail(e)}}
async function addUpdate(){const body=prompt("Write a project update or comment:");if(!body?.trim())return;try{const r=await sb.from("special_project_updates").insert({project_id:state.selected,body:body.trim(),update_type:"comment",author_uid:state.user.id});if(r.error)throw r.error;toast("Update posted");await openProject(state.selected)}catch(e){fail(e)}}
async function addMember(){const uid=prompt("Enter the member's Supabase Auth user UUID:");if(!uid?.trim())return;const role=prompt("Role: manager, contributor, or viewer","contributor");if(!["manager","contributor","viewer"].includes(role)){toast("Role must be manager, contributor, or viewer.",true);return}try{const r=await sb.from("special_project_members").insert({project_id:state.selected,user_id:uid.trim(),role});if(r.error)throw r.error;toast("Member added");await openProject(state.selected)}catch(e){fail(e)}}
$("newProjectBtn").onclick=newProject;$("refreshBtn").onclick=async()=>{try{await loadProjects(true);toast("Refreshed")}catch(e){fail(e)}};$("projectList").addEventListener("click",e=>{const b=e.target.closest("[data-project]");if(b)openProject(b.dataset.project)});window.newProject=newProject;
(async()=>{try{if(await requireSession())await loadProjects(false)}catch(e){fail(e);$("projectList").innerHTML='<div class="empty">Could not load projects. Confirm the database setup SQL has been run.</div>'}})();
</script>
</body></html>
