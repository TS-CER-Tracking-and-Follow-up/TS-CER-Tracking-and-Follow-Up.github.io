  state.tab=b.dataset.tab;renderDetail();

   const result=item?await sb.from("special_project_items").update(payload).eq("id",item.id).select().single():await sb.from("special_project_items").insert({...payload,created_by:state.user.id}).select().single();
   if(result.error)throw result.error;

async function quotesModal(item){if(!item)return;let quotes=[];try{quotes=await rows("special_project_item_quotes",sb.from("special_project_item_quotes").select("*").eq("item_id",item.id).order("quoted_unit_price"));}catch(e){fail(e);return}const list=()=>quotes.length?'<div class="tablewrap"><table style="min-width:650px"><thead><tr><th>Supplier / quote</th><th>Unit price</th><th>Lead time</th><th>Compliance</th><th>Action</th></tr></thead><tbody>'+quotes.map(q=>'<tr><td><strong>'+esc(q.supplier_name)+'</strong><div class="muted">'+esc(q.quote_reference||"No reference")+'</div><div class="muted">'+esc(q.payment_terms||"")+'</div>'+(q.is_selected?'<span class="pill status">Selected</span>':"")+'</td><td>'+esc(q.currency||"BDT")+' '+money(q.quoted_unit_price)+'</td><td>'+esc(q.delivery_days??"—")+' days</td><td>'+esc(statusLabel(q.technical_compliance||"pending"))+'</td><td><button type="button" class="btn small" data-select-quote="'+q.id+'">'+(q.is_selected?"Selected":"Select")+'</button></td></tr>').join("")+'</tbody></table></div>':'<div class="empty">No supplier quotations recorded for this item.</div>';modal("Supplier quotations · "+item.item_name,'<p class="muted">Compare multiple vendors for the same purchase item. Selecting a quote marks it as preferred; it does not issue a purchase order.</p><div id="quoteList">'+list()+'</div><hr><h3>Add supplier quotation</h3><div class="formgrid">'+field("Supplier name","q_supplier","","text",false,'required')+field("Quote reference","q_ref")+field("Quoted unit price","q_price",0,"number",false,'required min="0" step="any"')+field("Currency","q_currency","BDT")+field("Delivery lead time (days)","q_days","","number",false,'min="0" step="1"')+field("Quote date","q_date","","date")+field("Payment terms","q_payment")+field("Technical compliance","q_compliance",options([["pending","Pending review"],["compliant","Compliant"],["deviation","Deviation / not compliant"]],"pending"),"select")+field("Quote notes","q_notes","", "textarea",true)+'</div>');const bindSelect=()=>{$("modalRoot").querySelectorAll("[data-select-quote]").forEach(b=>b.onclick=()=>selectQuote(item,b.dataset.selectQuote))};bindSelect();$("modalForm").onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget);const payload={project_id:state.selected,item_id:item.id,supplier_name:fd.get("q_supplier").trim(),quote_reference:fd.get("q_ref").trim()||null,quoted_unit_price:Number(fd.get("q_price")),currency:fd.get("q_currency").trim()||"BDT",delivery_days:fd.get("q_days")?Number(fd.get("q_days")):null,quote_date:fd.get("q_date")||null,payment_terms:fd.get("q_payment").trim()||null,technical_compliance:fd.get("q_compliance"),notes:fd.get("q_notes").trim()||null,created_by:state.user.id};try{const r=await sb.from("special_project_item_quotes").insert(payload).select().single();if(r.error)throw r.error;quotes.push(r.data);$("quoteList").innerHTML=list();$("modalForm").reset();toast("Quotation saved");bindSelect()}catch(err){fail(err)}}}
async function selectQuote(item,id){try{const r=await sb.from("special_project_item_quotes").update({is_selected:true}).eq("id",id);if(r.error)throw r.error;const others=await sb.from("special_project_item_quotes").update({is_selected:false}).eq("item_id",item.id).neq("id",id);if(others.error)throw others.error;toast("Preferred quotation selected");await quotesModal(item)}catch(e){fail(e)}}
function tasksMarkup(){return '<div class="sectionbar"><h3>Project tasks</h3><button class="btn primary" id="addTaskBtn">＋ Add task</button></div>'+(state.tasks.length?'<div class="tablewrap"><table><thead><tr><th>Task</th><th>Assignee UID</th><th>Status</th><th>Priority</th><th>Due</th><th>Action</th></tr></thead><tbody>'+state.tasks.map(t=>'<tr><td><strong>'+esc(t.title)+'</strong><div class="muted">'+esc(t.description||"")+'</div></td><td>'+esc(t.assignee_uid||"Unassigned")+'</td><td><select class="inline-input" style="min-width:125px" data-task-status="'+t.id+'">'+["todo","in_progress","blocked","done"].map(s=>'<option value="'+s+'" '+(t.status===s?'selected':'')+'>'+statusLabel(s)+'</option>').join("")+'</select></td><td>'+esc(t.priority)+'</td><td>'+esc(date(t.due_date))+'</td><td><div class="actions"><button class="btn small" data-edit-task="'+t.id+'">Edit</button><button class="btn small danger" data-delete-task="'+t.id+'">Delete</button></div></td></tr>').join("")+'</tbody></table></div>':'<div class="empty">No tasks yet. Add the first task for this project.</div>')}

function modal(title,inner,submitText="Save"){ $("modalRoot").innerHTML='<div class="modal" id="modalBackdrop"><form class="dialog" id="modalForm"><div class="dialoghead"><h2>'+title+'</h2><button type="button" class="btn small" id="modalClose">Close</button></div><div id="modalSaveError" class="notice error hidden" role="alert"></div>'+inner+'<div class="actions"><button class="btn primary" id="modalSaveButton" type="submit">'+submitText+'</button><button class="btn" type="button" id="modalCancel">Cancel</button></div></form></div>';$("modalClose").onclick=$("modalCancel").onclick=()=>{$("modalRoot").innerHTML=""};$("modalBackdrop").onclick=e=>{if(e.target.id==="modalBackdrop")$("modalRoot").innerHTML=""};$("modalForm").addEventListener("submit",()=>{const b=$("modalSaveButton");if(b){b.disabled=true;b.textContent="Saving…"}const box=$("modalSaveError");if(box){box.textContent="";box.classList.add("hidden")}});$("modalForm").addEventListener("submit",()=>{setTimeout(()=>{const b=$("modalSaveButton");if(b&&$("modalRoot").contains(b)){b.disabled=false;b.textContent=submitText}},8000)})}
function field(label,name,value="",type="text",wide=false,extra=""){let control;if(type==="textarea"){control='<textarea id="'+name+'" name="'+name+'" '+extra+'>'+esc(value)+'</textarea>'}else if(type==="select"){control='<select id="'+name+'" name="'+name+'" '+extra+'>'+value+'</select>'}else{control='<input id="'+name+'" name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+extra+'>'}return '<div class="field '+(wide?'wide':'')+'"><label for="'+name+'">'+label+'</label>'+control+'</div>'}
function options(vals,selected){return vals.map(([v,l])=>'<option value="'+v+'" '+(v===selected?'selected':'')+'>'+l+'</option>').join("")}
function projectModal(p=null){modal(p?"Edit project":"Create a project",'<div class="formgrid">'+field("Project title","title",p?.title||"","text",true,'required maxlength="160"')+field("Description","description",p?.description||"","textarea",true)+field("Approved budget (BDT)","approved_budget",p?.approved_budget??0,"number",false,'min="0" step="any" required')+field("Status","status",options([["active","Active"],["on_hold","On hold"],["completed","Completed"],["cancelled","Cancelled"]],p?.status||"active"),"select")+field("Priority","priority",options([["low","Low"],["medium","Medium"],["high","High"],["urgent","Urgent"]],p?.priority||"medium"),"select")+field("Start date","start_date",p?.start_date||"","date")+field("Due date","due_date",p?.due_date||"","date")+'</div>');$("modalForm").onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget);const payload={title:fd.get("title").trim(),description:fd.get("description").trim(),approved_budget:Number(fd.get("approved_budget")||0),status:fd.get("status"),priority:fd.get("priority"),start_date:fd.get("start_date")||null,due_date:fd.get("due_date")||null,updated_at:new Date().toISOString()};try{const result=p?await sb.from("special_projects").update(payload).eq("id",p.id).select().single():await sb.from("special_projects").insert({...payload,owner_uid:state.user.id}).select().single();if(result.error)throw result.error;$("modalRoot").innerHTML="";toast(p?"Project updated":"Project created");await loadProjects(true);if(!p)await openProject(result.data.id)}catch(err){fail(err)}}}
